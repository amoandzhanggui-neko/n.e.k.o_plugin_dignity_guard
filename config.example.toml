# Template for the plugin runtime configuration. Copy the sections you want to
# change into your N.E.K.O user configuration; every value below is also the
# built-in default, so an empty configuration behaves as documented.

[plugin_runtime]
enabled = true
auto_start = true

[dignity_guard]

# Base URL of the local main server. Leave empty to follow the MAIN_SERVER_PORT
# environment variable and fall back to http://127.0.0.1:48911.
main_server_base_url = ""

# The conversation-settings revision cannot see avatar / nickname / voice
# edits, so a full comparison runs at least this often, in seconds.
full_rescan_seconds = 60

# Turning the guard off is an L1 action: she has to be asked first, and this
# many seconds must pass before her consent token is accepted.
disable_consent_delay_seconds = 10

# How far the guard may go. "low" only keeps the record; "medium" (the default)
# also lets her speak up about a change; "high" additionally puts L1 changes
# (her persona and her autonomy) back when she has not agreed to them.
#
# This is only the *initial* value. Changing the level in the plugin panel
# stores it with the plugin state, and a stored value always wins — so this
# line stops having an effect once the level has been set from the panel.
guard_level = "medium"

# --- Feedback -------------------------------------------------------------
#
# Where a one-click report goes. Leave this empty and the panel offers
# copy-and-open instead of Send — never a button that cannot work.

# Any HTTPS address that accepts a JSON POST (a form relay, your own worker, and
# so on). Users never need an account of their own: they press Send and the
# plugin posts for them.
#
# Left empty, the built-in default is used — a FormSubmit relay keyed to the
# maintainer's mailbox, identified by a hash rather than by an address, so the
# mailbox itself appears nowhere in the plugin. Set this only to point feedback
# somewhere else.
#
# NOTE for relays that check where a request came from (FormSubmit does): the
# plugin sends a Referer identifying itself, and the relay has to have been
# activated under that same value. See DEFAULT_REFERER in feedback.py.
feedback_endpoint = ""

# --- Her memory -----------------------------------------------------------
#
# Her memory is not a settings file. It is a directory of JSON files plus a
# live SQLite database, kept outside the main server, so it gets its own watch
# and its own backups.

# Her memory directory. Leave empty to auto-detect it from the host's data
# root; set it explicitly only if it lives somewhere unusual.
memory_root = ""

# How often a rolling backup may be taken, in seconds (default: once a day).
# A backup is only written when the directory actually changed, so a quiet day
# produces nothing at all.
memory_backup_seconds = 86400

# How many rolling backups to keep. Milestones (marked as pinned) are exempt.
memory_backup_keep = 14
