# Generated by neko-plugin
# managed-template: plugin-market-actions-v1
# NOTE(amo): 增加了 collect-log 作业。上游模板若重新生成本文件，需要把这段补回来。
name: Verify N.E.K.O Plugin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: Project-N-E-K-O/N.E.K.O/.github/workflows/plugin-market-verify.yml@main
    with:
      plugin-id: dignity_guard
      neko-repository: Project-N-E-K-O/N.E.K.O
      neko-ref: main

  # 失败时把 verify 作业的日志抓下来，推到 ci-log 分支。
  # 目的：仓库是公开的，但 Actions 日志接口要管理员权限；
  # 用运行时的 GITHUB_TOKEN（只需 actions:read + contents:write）绕过这个限制。
  collect-log:
    needs: verify
    if: always() && needs.verify.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Fetch failed job log
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -u
          JOB_ID=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" \
            --jq '.jobs[] | select(.conclusion=="failure") | .id' | head -n1)
          echo "failed job id: ${JOB_ID:-none}"
          if [ -z "${JOB_ID:-}" ]; then
            echo "no failed job found (conclusion may be cancelled)" > ci-log.txt
            exit 0
          fi
          # 先按作业取（公开 API 也走同一路径，GITHUB_TOKEN 有 actions:read 即可）
          gh api "repos/$REPO/actions/jobs/$JOB_ID/logs" > full.log || true
          wc -c full.log || true
          if [ ! -s full.log ]; then
            gh run view "$RUN_ID" --log > full.log || true
          fi
          # 只保留尾部，避免把整包依赖下载日志也提交进去
          tail -c 200000 full.log > ci-log.txt || true
          wc -c ci-log.txt || true

      - name: Push log to ci-log branch
        run: |
          set -e
          git init -q .
          git config user.name "ci-diagnose"
          git config user.email "ci-diagnose@users.noreply.github.com"
          git checkout -q -b ci-log
          git add ci-log.txt
          git commit -q -m "ci: failed run ${{ github.run_id }} log [skip ci]" || {
            echo "nothing to commit"; exit 0;
          }
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-log