# 插件自带的 pytest 配置。
#
# 为什么需要它：官方插件模板（`lifekit`、`mcp_adapter` 等）都不带 pytest
# 配置 —— 它们在 N.E.K.O 仓库内运行，靠仓库根的 `pytest.ini` 提供
# `asyncio_mode = auto`。这个插件投稿时是**独立 GitHub 仓库**
# （见 README 的 `amoandzhanggui-neko/n.e.k.o_plugin_dignity_guard`），
# 那时根配置不存在，`tests/` 里的 async 用例会集体报
# "async def functions are not natively supported"。
#
# ⚠️ 这件事最坏的地方不是"失败"，而是**失败的样子**：那批用例被打成
# `Failed` 而不是让套件报错退出，于是总数从 128 掉到 112 —— 看起来只是
# "少了一些"，不会有人去数。一个"看起来在跑、其实没跑"的测试套件，
# 比一个显眼报错的套件危险得多。
#
# ⚠️ 已知遗留（只解决了一半）：独立仓库形态下，这些测试还 import 了宿主的
# `plugin.plugins.dignity_guard` 与 `plugin.sdk.plugin` 包，所以光有本文件
# 还不够 —— 独立 CI 还得能拿到 N.E.K.O 的 `plugin` 包。本文件只负责保证
# "async 用例真的在跑"这一半，而它是更危险的那一半。
[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
