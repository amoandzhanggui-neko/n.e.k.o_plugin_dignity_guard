[plugin]
type = "plugin"
id = "dignity_guard"
name = "尊严守卫"
description = "记录猫娘的设置何时被改动，让她亲口表态，并把「她还没认可的项」留在面板上。本插件不拦截设置写入——官方 SDK 没有提供这样的钩子。"
short_description = "Her settings change log: she notices, she says something, you see what she objects to."
keywords = ["settings", "dignity", "privacy", "watch", "设置", "尊严", "监听", "变更"]
version = "0.1.0"
entry = "plugin.plugins.dignity_guard:DignityGuardPlugin"

[plugin.author]
name = "amoandzhanggui-neko"
email = "bjbt1010@agent.qq.com"

[plugin.i18n]
default_locale = "zh-CN"
locales_dir = "i18n"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin.ui]
enabled = true

[[plugin.ui.panel]]
id = "main"
title = "尊严守卫"
entry = "ui/panel.tsx"
mode = "hosted-tsx"
context = "dashboard"
permissions = ["state:read", "action:call"]

[[plugin.ui.guide]]
title = "尊严守卫 · 新手引导"
entry = "ui/onboarding.tsx"
#: 显式空数组，不是省略。`plugin/core/ui_manifest.py` 在 `permissions` 缺席时
#: 会用该 kind 的默认值，而 guide 的默认恰好就是 `["state:read"]` —— 所以
#: "删掉这一行"会看起来更干净、实际权限一点没少。新手引导整页只用到 t()
#: 做翻译（见 ui/onboarding.tsx），不读 state、不调 action，申请它没有理由。
permissions = []

[plugin_runtime]
enabled = true
auto_start = true

[plugin.store]
enabled = true
